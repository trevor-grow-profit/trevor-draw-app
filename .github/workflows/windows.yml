# Windows packaging on pull requests (YAZ-2073 1A, 🔒 D17): a change to the shell, its build config or the
# pack tools can break the Windows installer, which release.yml otherwise only builds on a `v*` tag.
# Build only — nothing is installed, signed or uploaded.
name: windows

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'share/**'
      - 'tools/pack*'
      - 'tools/buildShareViewer.mjs'
      - 'tools/lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned draw.io pack (YAZ-1802 D5), cached as in ci.yml: the build unpacks it, a download otherwise.
      - id: drawio
        shell: bash
        run: node -e "import('./tools/packDrawio.mjs').then((m) => console.log('tag=' + m.DRAWIO_TAG))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ steps.drawio.outputs.tag }}
      - run: npm run desktop:build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
