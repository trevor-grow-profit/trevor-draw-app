# CI (YAZ-1775 🔒 D7): every pull request gets a typecheck and the unit-test suite.
# No Playwright/e2e here — behaviour is verified by launching the dev app against a test vault.
name: ci

on:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The pinned draw.io pack (YAZ-1802 D5), so the suites that read the real bundle run here too.
      - id: drawio
        run: node -e "import('./tools/packDrawio.mjs').then((m) => console.log('tag=' + m.DRAWIO_TAG))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: desktop/.cache/drawio
          key: drawio-${{ steps.drawio.outputs.tag }}
      - run: npm run drawio:pack
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The size and integrity gate on the fresh build (YAZ-2073 1A): chunk closure, fonts, draw.io files, renderer
      # and main bytes against tools/perf/budget.json. The packaged half (.app, DMG, Info.plist, seal) runs locally.
      - run: npm run perf:budget -- --out-only
